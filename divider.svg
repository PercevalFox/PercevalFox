<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 26" width="1000" height="26" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff003c" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ff8c1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <filter id="dgl" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="0" y1="13" x2="1000" y2="13" stroke="#ff8c1a" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="0" y1="13" x2="1000" y2="13" stroke="url(#dg)" stroke-width="2" filter="url(#dgl)"/>

  <g fill="#39ff14" filter="url(#dgl)">
    <circle cx="0" cy="13" r="3">
      <animate attributeName="cx" values="-20;1020" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="13" r="2">
      <animate attributeName="cx" values="-20;1020" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="13" r="2.4" fill="#ff8c1a">
      <animate attributeName="cx" values="-20;1020" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
