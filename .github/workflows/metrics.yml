name: 📊 Generate Metrics

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Token requis : PAT classic, scope read:user uniquement.
#
# Note : une seule carte dense plutôt que 4 clairsemées. Les plugins sociaux
# (topics, followup, reactions, discussions, people) sont volontairement absents :
# ce compte a 3551 commits pour 0 PR et 0 discussion, ils rendraient des cadres vides.

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: PercevalFox
          base: header, activity, community, repositories
          config_timezone: Europe/Paris

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_sections: most-used

          plugin_lines: yes
