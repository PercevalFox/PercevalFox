name: 📊 Generate Metrics

on:
  schedule:
    - cron: "23 5 * * *"      # 1x / jour, le matin
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: PercevalFox
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          config_theme: dark
          plugin_lines: yes

      - name: Isometric calendar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: PercevalFox
          base: ""
          config_timezone: Europe/Paris
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: PercevalFox
          base: ""
          config_theme: dark
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 12
          plugin_languages_sections: most-used

      # Le plugin habits est capricieux : il lui faut les scopes public_repo + read:org
      # pour lire le contenu des commits. Si l'erreur persiste, commente ce step
      # et décommente le suivant.
      - name: Habits
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: PercevalFox
          base: ""
          config_timezone: Europe/Paris
          config_theme: dark
          plugin_habits: yes
          plugin_habits_from: 100          # moins d'events = moins de risque de timeout
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # --- Alternative si habits refuse de coopérer ---
      # - name: Achievements
      #   if: ${{ success() || failure() }}
      #   uses: lowlighter/metrics@latest
      #   with:
      #     filename: metrics/habits.svg
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     committer_token: ${{ secrets.GITHUB_TOKEN }}
      #     user: PercevalFox
      #     base: ""
      #     config_theme: dark
      #     plugin_achievements: yes
