<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="PercevalFox - Lead DevSecOps / Red Team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12090a"/>
    </linearGradient>

    <linearGradient id="foxgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="55%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#ff4d00"/>
    </linearGradient>

    <linearGradient id="titlegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c1a"/>
      <stop offset="50%" stop-color="#ffd28a"/>
      <stop offset="100%" stop-color="#ff003c"/>
      <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ff8c1a" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>


    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A4500"/><stop offset="45%" stop-color="#FFD86B"/><stop offset="100%" stop-color="#C46A00"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2008"/><stop offset="100%" stop-color="#8A5312"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#FFD86B" stop-opacity="0.34"/><stop offset="100%" stop-color="#FFD86B" stop-opacity="0"/>
    </radialGradient>
    <filter id="gglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rayblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>

    <clipPath id="cup"><ellipse cx="100" cy="58" rx="50" ry="13"/></clipPath>

    <clipPath id="frame"><rect x="1" y="1" width="998" height="318" rx="14"/></clipPath>

    <clipPath id="l1"><rect x="40" y="96" height="20" width="0"><animate attributeName="width" from="0" to="240" dur="0.5s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="122" height="20" width="0"><animate attributeName="width" from="0" to="560" dur="0.9s" begin="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="156" height="20" width="0"><animate attributeName="width" from="0" to="300" dur="0.6s" begin="2.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="182" height="20" width="0"><animate attributeName="width" from="0" to="560" dur="1.0s" begin="2.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="40" y="216" height="20" width="0"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="4.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="40" y="250" height="22" width="0"><animate attributeName="width" from="0" to="560" dur="0.7s" begin="5.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- ambient glows -->
    <circle cx="880" cy="70" r="150" fill="#ff8c1a" opacity="0.07" filter="url(#softglow)"/>
    <circle cx="60" cy="300" r="130" fill="#ff003c" opacity="0.06" filter="url(#softglow)"/>

    <!-- terminal chrome -->
    <rect x="0" y="0" width="1000" height="34" fill="#05070a"/>
    <line x1="0" y1="34" x2="1000" y2="34" stroke="#ff8c1a" stroke-opacity="0.28"/>
    <circle cx="22" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="62" cy="17" r="5.5" fill="#28c840"/>
    <text x="500" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">
      root@rootcamp.dev: ~/percevalfox — zsh — 132×34
    </text>
    <text x="960" y="22" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#39ff14" opacity="0.75">
      ● LIVE
      <animate attributeName="opacity" values="0.75;0.2;0.75" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- typed lines -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5">
      <g clip-path="url(#l1)">
        <text x="40" y="111" fill="#39ff14">$</text>
        <text x="58" y="111" fill="#e6edf3">whoami --full</text>
      </g>
      <g clip-path="url(#l2)">
        <text x="40" y="137" fill="#ff8c1a">→ Steven Le Bris · Lead DevSecOps · Red Team · Enseignant</text>
      </g>

      <g clip-path="url(#l3)">
        <text x="40" y="171" fill="#39ff14">$</text>
        <text x="58" y="171" fill="#e6edf3">cat ~/.creed</text>
      </g>
      <g clip-path="url(#l4)">
        <text x="40" y="197" fill="#c9a227">"Casser proprement. Reconstruire solidement. Transmettre."</text>
      </g>

      <g clip-path="url(#l5)">
        <text x="40" y="231" fill="#39ff14">$</text>
        <text x="58" y="231" fill="#e6edf3">./init --soc --cert --k8s --pentest --hardening</text>
      </g>

      <g clip-path="url(#l6)">
        <text x="40" y="266" fill="#39ff14" font-size="14">[  OK  ]</text>
        <text x="112" y="266" fill="#7d8590" font-size="14">uplink established · 7+ ans en zone rouge</text>
      </g>

      <!-- blinking cursor -->
      <rect x="40" y="286" width="9" height="17" fill="#39ff14" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;1;0;1" keyTimes="0;0.85;0.87;0.92;0.94;0.98;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- le Graal -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="5.4s" fill="freeze"/>
      <g transform="translate(720,44) scale(0.80)">

        <circle cx="100" cy="66" r="78" fill="url(#halo)"/>

        <g fill="#FFD86B" filter="url(#rayblur)">
          <polygon points="100,60 56,10 70,4" opacity="0.28">
            <animate attributeName="opacity" values="0.28;0.09;0.28" dur="4s" repeatCount="indefinite"/></polygon>
          <polygon points="100,60 82,4 94,1" opacity="0.40">
            <animate attributeName="opacity" values="0.40;0.15;0.40" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></polygon>
          <polygon points="100,60 108,1 120,6" opacity="0.40">
            <animate attributeName="opacity" values="0.40;0.13;0.40" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></polygon>
          <polygon points="100,60 132,8 144,18" opacity="0.26">
            <animate attributeName="opacity" values="0.26;0.09;0.26" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></polygon>
          <polygon points="100,60 44,26 40,40" opacity="0.20">
            <animate attributeName="opacity" values="0.20;0.07;0.20" dur="5s" begin="1.6s" repeatCount="indefinite"/></polygon>
        </g>

        <!-- calice : facettes + intérieur -->
        <g filter="url(#gglow)" stroke="#3A1D00" stroke-width="1.3" stroke-linejoin="round">
          <polygon points="50,58 75,58 82,88 64,88"       fill="#A85A00"/>
          <polygon points="75,58 100,58 100,88 82,88"     fill="#FFB020"/>
          <polygon points="100,58 125,58 118,88 100,88"   fill="#FFD86B"/>
          <polygon points="125,58 150,58 136,88 118,88"   fill="#9C5200"/>
          <polygon points="64,88 82,88 93,112 86,112"     fill="#C46A00"/>
          <polygon points="82,88 100,88 100,112 93,112"   fill="#FFC64A"/>
          <polygon points="100,88 118,88 107,112 100,112" fill="#E89A10"/>
          <polygon points="118,88 136,88 114,112 107,112" fill="#8A4500"/>
          <polygon points="93,112 107,112 106,124 94,124"  fill="#D07800"/>
          <polygon points="100,118 114,131 100,144 86,131" fill="#FFD86B"/>
          <polygon points="100,118 114,131 100,144"        fill="#C46A00"/>
          <polygon points="94,142 106,142 109,158 91,158"  fill="#D07800"/>
          <polygon points="91,158 109,158 134,174 66,174"  fill="#FFB020"/>
          <ellipse cx="100" cy="174" rx="34" ry="8" fill="url(#gold)"/>
        </g>

        <!-- creux de la coupe -->
        <ellipse cx="100" cy="58" rx="50" ry="13" fill="url(#inner)" stroke="none"/>

        <!-- LA SAUCISSE, au fond du Graal, découpée par le bord de la coupe -->
        <g clip-path="url(#cup)">
          <g opacity="0">
            <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="6.4s" fill="freeze"/>
            <animateTransform attributeName="transform" type="translate"
                              values="0,-30; 0,4; 0,-2; 0,0" keyTimes="0;0.6;0.82;1"
                              dur="0.7s" begin="6.4s" fill="freeze"/>
            <path d="M 70,60 C 82,71 118,71 132,58" fill="none" stroke="#6B2F18" stroke-width="19" stroke-linecap="round"/>
            <path d="M 70,60 C 82,71 118,71 132,58" fill="none" stroke="#B85C38" stroke-width="15" stroke-linecap="round"/>
            <path d="M 73,56 C 84,65 116,65 130,54" fill="none" stroke="#D9865C" stroke-width="3.5"
                  stroke-linecap="round" opacity="0.8"/>
            <path d="M 88,63 l 1,7 M 104,66 l 0,7 M 119,62 l -1,7" stroke="#6B2F18" stroke-width="2.2"
                  stroke-linecap="round" opacity="0.55"/>
          </g>
        </g>

        <!-- bord du calice, PAR-DESSUS la saucisse -->
        <g filter="url(#gglow)">
          <ellipse cx="100" cy="58" rx="50" ry="13" fill="none" stroke="#FFD86B" stroke-width="3"/>
          <path d="M 56,62 A 50 13 0 0 0 144,62" fill="none" stroke="#FFE9A8" stroke-width="2.5" opacity="0.55"/>
        </g>

        <g fill="#FFF3C4">
          <path d="M40,62 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z">
            <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></path>
          <path d="M162,70 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2 z">
            <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></path>
          <path d="M140,112 l1.8,4.5 4.5,1.8 -4.5,1.8 -1.8,4.5 -1.8,-4.5 -4.5,-1.8 4.5,-1.8 z">
            <animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></path>
        </g>

      </g>
    </g>

    <!-- title block -->
    <text x="700" y="248" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="30" font-weight="700"
          fill="url(#titlegrad)" filter="url(#glow)" letter-spacing="1.5" opacity="0">
      PercevalFox
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="6.0s" fill="freeze"/>
    </text>
    <text x="700" y="270" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#7d8590" letter-spacing="2.2" opacity="0">
      DEFEND · BREAK · AUTOMATE · TEACH
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="6.4s" fill="freeze"/>
    </text>

    <!-- scanline sweep -->
    <rect x="0" y="-40" width="1000" height="40" fill="#39ff14" opacity="0.05">
      <animate attributeName="y" values="-40;320" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- CRT scanlines -->
    <g stroke="#000" stroke-opacity="0.16">
      <path d="M0 38H1000M0 42H1000M0 46H1000M0 50H1000M0 54H1000M0 58H1000M0 62H1000M0 66H1000M0 70H1000M0 74H1000M0 78H1000M0 82H1000M0 86H1000M0 90H1000M0 94H1000M0 98H1000M0 102H1000M0 106H1000M0 110H1000M0 114H1000M0 118H1000M0 122H1000M0 126H1000M0 130H1000M0 134H1000M0 138H1000M0 142H1000M0 146H1000M0 150H1000M0 154H1000M0 158H1000M0 162H1000M0 166H1000M0 170H1000M0 174H1000M0 178H1000M0 182H1000M0 186H1000M0 190H1000M0 194H1000M0 198H1000M0 202H1000M0 206H1000M0 210H1000M0 214H1000M0 218H1000M0 222H1000M0 226H1000M0 230H1000M0 234H1000M0 238H1000M0 242H1000M0 246H1000M0 250H1000M0 254H1000M0 258H1000M0 262H1000M0 266H1000M0 270H1000M0 274H1000M0 278H1000M0 282H1000M0 286H1000M0 290H1000M0 294H1000M0 298H1000M0 302H1000M0 306H1000M0 310H1000M0 314H1000M0 318H1000"/>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="318" rx="14" fill="none" stroke="#ff8c1a" stroke-opacity="0.4"/>
</svg>
